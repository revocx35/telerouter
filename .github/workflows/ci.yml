name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q

  client-py39:
    # macOS ships Python 3.9 with the Command Line Tools: the client must keep working there
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install ./client
      - run: python -m compileall -q client/telerouter_client && telerouter-client --version
      - run: sh -n client/install.sh

  e2e:
    # real image + real Whisper/Piper/openWakeWord, a speaker client fed with a WAV
    runs-on: ubuntu-latest
    needs: [tests]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Start the stack
        run: |
          mkdir -p data whisper-data piper-data wake-models
          sudo chown 1000:1000 data whisper-data piper-data
          printf 'TELEROUTER_SETUP_CODE=E2E-CODE1\nWHISPER_MODEL=tiny-int8\nWHISPER_THREADS=2\n' > .env
          sed -i 's#image: ghcr.io/revocx35/telerouter:${TELEROUTER_VERSION:-latest}#image: telerouter:ci#' docker-compose.yml
          docker compose up -d --build
      - run: pip install ./client
      - run: python tools/e2e.py --setup-code E2E-CODE1
      - if: failure()
        run: |
          docker compose ps
          docker logs telerouter | tail -80
          docker logs telerouter-whisper | tail -30
